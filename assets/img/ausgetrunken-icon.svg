<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ausgetrunken brand icon — the single source for both platforms.

  Full-bleed, as iOS and the Play listing want it. Android's launcher does NOT use this file:
  it needs a 108dp adaptive icon with a safe zone, which lives in
  Android/app/src/main/res/drawable/ic_launcher_foreground.xml with the same geometry.

  Export at 1024x1024 for iOS and 512x512 (no alpha) for the Play Store listing.
-->
